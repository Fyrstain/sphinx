name: React snapshot (reusable)

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        default: '24'
        type: string
      working_directory:
        required: false
        default: '.'
        type: string
      image_name:
        description: Image name without the registry, for example product/sphinx/front.
        required: true
        type: string
      docker_context:
        required: false
        default: '.'
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      image_tag:
        description: Optional Docker tag override for an isolated test build.
        required: false
        default: ''
        type: string
      build_args:
        description: Newline-delimited Docker build arguments.
        required: false
        default: ''
        type: string
    secrets:
      registry:
        description: Docker registry host name.
        required: true
      username:
        required: true
      password:
        required: true
      npmrc:
        description: Complete .npmrc content passed to Docker BuildKit as npmrc.
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish snapshot image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Read and validate snapshot version
        id: version
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "package.json must contain an X.Y.Z-SNAPSHOT version; got: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "${IMAGE_TAG:-$VERSION}" >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.working_directory }}

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.registry }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Build and push snapshot image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          push: true
          secrets: |
            "npmrc=${{ secrets.npmrc }}"
          tags: |
            ${{ secrets.registry }}/${{ inputs.image_name }}:${{ steps.version.outputs.tag }}
