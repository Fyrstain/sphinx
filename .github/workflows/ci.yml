name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/react-ci.yml
    with:
      node_version: '24'
      java_version: '17'
      fsh_sushi_version: latest
      install_jekyll: true
      ruby_version: '3.3'
      working_directory: .
    secrets:
      npmrc: ${{ secrets.NPMRC }}
