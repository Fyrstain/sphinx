name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: Fyrstain/github-workflows/.github/workflows/react-ci.yml@1.2.0
    with:
      node_version: '24'
      run_e2e: true
      java_version: '17'
      fsh_sushi_version: latest
      install_jekyll: true
      ruby_version: '3.3'
      working_directory: .
    secrets:
      npmrc: ${{ secrets.NPMRC }}
